<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2980b9; } a:hover { color: #1c5a85; }
    .rp-scroll::-webkit-scrollbar { width: 6px; }
    .rp-scroll::-webkit-scrollbar-thumb { background: #d0d4da; border-radius: 3px; }
  </style>
</helmet>

<div style="background: #f5f7fa; padding: 24px; box-sizing: border-box; min-height: 100%;">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px;">
    <div>
      <h1 style="font-size: 22px; color: #2c3e50; margin: 0; font-weight: 700;">Reports</h1>
      <p style="font-size: 13px; color: #7f8c8d; margin: 6px 0 0; line-height: 1.5; max-width: 620px;">
        Every report in one place, grouped by the question it answers. Each one opens with the
        date range you already have set.
      </p>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; color: #7f8c8d; font-weight: 600;">Range</span>
      <select style="padding: 8px 10px; border: 1px solid #d0d4da; border-radius: 6px; font-size: 13px; color: #2c3e50; background: #fff;">
        <option>Today</option><option>Last 7 days</option><option>This month</option>
      </select>
    </div>
  </div>

  <!-- Search across every report, because 21 is past the point where scanning
       groups is faster than typing. -->
  <input placeholder="Search reports — try &quot;refund&quot;, &quot;cash&quot;, &quot;table&quot;…"
    value="{{query}}" onInput="{{onSearch}}"
    style="width: 100%; max-width: 420px; padding: 9px 12px; border: 1px solid #d0d4da; border-radius: 6px; font-size: 14px; box-sizing: border-box; color: #2c3e50; margin: 16px 0 12px;" />

  <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
      <button onClick="{{g.pick}}" style="{{g.style}}">
        <span>{{g.name}}</span>
        <span style="{{g.countStyle}}">{{g.count}}</span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
    <div style="text-align: center; padding: 48px 20px; color: #7f8c8d; font-size: 15px; background: #fff; border-radius: 8px;">
      No report matches “{{query}}”.
      <div style="margin-top: 10px;">
        <button onClick="{{reset}}" style="background: none; border: none; color: #2980b9; cursor: pointer; font-size: 13px; font-weight: 600; padding: 0;">Clear</button>
      </div>
    </div>
  </sc-if>

  <div class="rp-scroll" style="display: flex; flex-direction: column; gap: 22px; max-height: 660px; overflow-y: auto; padding-right: 4px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
      <div>
        <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;">
          <h2 style="font-size: 14px; color: #2c3e50; margin: 0; font-weight: 700;">{{s.name}}</h2>
          <span style="font-size: 12px; color: #95a5a6;">{{s.blurb}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 10px;">
          <sc-for list="{{s.reports}}" as="r" hint-placeholder-count="4">
            <div style="background: #fff; border: 1px solid #e1e5eb; border-radius: 8px; padding: 13px 14px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.05);">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
                <span style="font-size: 13.5px; font-weight: 600; color: #2c3e50;">{{r.name}}</span>
                <span style="{{r.tagStyle}}">{{r.tag}}</span>
              </div>
              <div style="font-size: 12px; color: #7f8c8d; line-height: 1.55; margin-top: 5px;">{{r.answers}}</div>
              <div style="font-size: 10.5px; color: #b9c2cc; margin-top: 8px;">{{r.where}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"showOrigin":{"editor":"boolean","default":true,"section":"Content"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { group: 'all', query: '' };
  }

  // The 21 reports that actually exist, read off the routes and the pages that
  // render them. `where` is where each one lives TODAY — the point of the
  // exercise is that a cashier cannot guess most of them.
  catalogue() {
    return [
      ['Sales & revenue', 'What was sold, and for how much', [
        ['Overview',        'Invoiced vs collected, and the net position',        'Finance › Overview', 'ledger'],
        ['Sales',           'Revenue over time, bucketed',                         'Finance › Sales', 'ledger'],
        ['Products',        'Which dishes sold, by quantity and value',            'Finance › Products', 'ledger'],
        ['Channels',        'Dine-in vs takeaway vs each portal',                  'Finance › Channels', 'ledger'],
        ['Floors & tables', 'What each table earned, and per seat',                'Finance › Floors & Tables', 'ledger'],
        ['Discounts',       'What was given away, and on what',                    'Finance › Discounts', 'ledger'],
      ]],
      ['Money & reconciliation', 'Where the money went, and whether it balances', [
        ['Tenders (Z-report)', 'Cash, card, UPI and portal settlement',            'Finance › Tenders', 'ledger'],
        ['Cash flow',       'Money in and out, per account',                       'Finance › Cash Flow', 'ledger'],
        ['Outstanding',     'Invoiced but not yet collected',                      'Finance › Pending', 'ledger'],
        ['Expenses',        'Spend by category',                                   'Finance › Expenses', 'ledger'],
        ['Cash sessions',   'Counted vs expected, per cashier shift',              'Cash Sessions', 'pos'],
      ]],
      ['Returns & quality', 'What came back, and whose fault it was', [
        ['Return reasons',  'Why goods came back — and how much was our fault',    'Returns', 'ledger'],
        ['Returned products', 'Which dishes come back most, as a rate',            'Returns', 'ledger'],
      ]],
      ['Customers', 'Who bought, how often, and who stopped', [
        ['Customers',       'Spend, visits and average order per customer',        'Finance › Customers', 'ledger'],
        ['Visit pattern',   'Which days and hours they come',                      'Finance › Visit Pattern', 'ledger'],
        ['Lapsed',          'Regulars who have stopped coming',                    'Finance › Customers (folded in)', 'ledger'],
        ['Loyalty statement', 'Every points movement, and why',                    'Customer profile drawer', 'pos'],
      ]],
      ['Campaigns', 'What a promotion cost and what it returned', [
        ['Campaign performance', 'Given away, redemptions, revenue, cost each',    'Campaigns › (open one)', 'pos'],
      ]],
      ['Operations', 'How the service itself ran', [
        ['Token queue',     'Counter throughput and wait times',                   'Not surfaced — API only', 'gap'],
        ['Today',           'Live counts: orders, tables, customers, feedback',    'Front Desk › Reports', 'pos'],
        ['Feedback ratings', 'Average rating over time, and by dish',              'Not built — data exists, nothing aggregates it', 'gap'],
      ]],
      ['Assets', 'What the outlet owns', [
        ['Asset register',  'What is owned, where, and what it cost',              'Asset Register', 'pos'],
      ]],
      ['Documents & audit', 'The paper trail every figure lands on', [
        ['Ledger',          'Every invoice, credit note and expense, filterable',  'Ledger', 'ledger'],
        ['Audit log',       'Who did what, and when',                              'Audit Logs (top-level menu)', 'pos'],
      ]],
    ];
  }

  renderVals() {
    const { group, query } = this.state;
    const showOrigin = this.props.showOrigin !== false;
    const q = query.trim().toLowerCase();

    const hit = (r) => !q
      || r[0].toLowerCase().includes(q)
      || r[1].toLowerCase().includes(q)
      || r[2].toLowerCase().includes(q);

    const all = this.catalogue();
    const countIn = (name) => all
      .filter((s) => name === 'all' || s[0] === name)
      .reduce((n, s) => n + s[2].filter(hit).length, 0);

    const chip = (on) =>
      'display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;'
      + ' padding: 8px 14px; border-radius: 18px; font-size: 13px; font-weight: 600;'
      + ' cursor: pointer; transition: all 0.15s ease;'
      + (on ? ' background: #0f3460; color: #fff; border: 1px solid #0f3460;'
            : ' background: #fff; color: #5a6c7d; border: 1px solid #d0d4da;');

    const countPill = (on) =>
      'font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 9px;'
      + (on ? ' background: rgba(255,255,255,0.22); color: #fff;'
            : ' background: #f0f4f8; color: #7f8c8d;');

    const groups = [{ id: 'all', name: 'All' }]
      .concat(all.map((s) => ({ id: s[0], name: s[0] })))
      .map((g) => {
        const on = group === g.id;
        return {
          name: g.name,
          count: countIn(g.id),
          style: chip(on),
          countStyle: countPill(on),
          pick: () => this.setState({ group: g.id }),
        };
      });

    // A source tag, because "where does this number come from" is the second
    // question anyone asks of a report they did not write.
    const TAGS = {
      ledger: ['Ledger', 'background: #eef4fb; color: #0f3460;'],
      pos: ['POS', 'background: #eafaf1; color: #1e8449;'],
      gap: ['Not built', 'background: #fef3e6; color: #b9600f;'],
    };

    const sections = all
      .filter((s) => group === 'all' || s[0] === group)
      .map((s) => ({
        name: s[0],
        blurb: s[1],
        reports: s[2].filter(hit).map((r) => ({
          name: r[0],
          answers: r[1],
          where: showOrigin ? 'Today: ' + r[2] : '',
          tag: TAGS[r[3]][0],
          tagStyle: 'font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;'
            + ' white-space: nowrap; flex: 0 0 auto; ' + TAGS[r[3]][1],
        })),
      }))
      .filter((s) => s.reports.length > 0);

    return {
      groups,
      sections,
      query,
      isEmpty: sections.length === 0,
      onSearch: (e) => this.setState({ query: e.target.value }),
      reset: () => this.setState({ query: '', group: 'all' }),
    };
  }
}
</script>
</body>
</html>
