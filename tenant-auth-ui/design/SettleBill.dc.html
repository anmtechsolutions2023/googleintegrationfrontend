<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2980b9; } a:hover { color: #1c5a85; }
  </style>
</helmet>

<div style="background: rgba(0,0,0,0.45); padding: 24px; box-sizing: border-box; min-height: 100%; display: flex; align-items: flex-start; justify-content: center;">

  <div style="background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 460px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); box-sizing: border-box;">

    <h3 style="margin: 0 0 14px; font-size: 16px; color: #2c3e50;">Settle Bill</h3>

    <!-- Bill summary, unchanged from the app -->
    <div style="background: #f8f9fa; border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px; margin-bottom: 16px;">
      <div style="font-size: 11px; font-weight: 700; color: #7f8c8d; letter-spacing: 0.4px; margin-bottom: 8px;">BILL</div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #2c3e50; margin-bottom: 4px;">
        <span>Subtotal</span><span>₹322.86</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #7f8c8d; margin-bottom: 3px;">
        <span style="padding-left: 10px;">CGST @ 2.5%</span><span>₹8.07</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #7f8c8d; margin-bottom: 8px;">
        <span style="padding-left: 10px;">SGST @ 2.5%</span><span>₹8.07</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: #2c3e50; border-top: 1px solid #e1e5eb; padding-top: 8px;">
        <span>Grand Total</span><span>₹339.00</span>
      </div>
    </div>

    <!-- ── PAYMENT MODES, on the screen ─────────────────────────────
         Was a 90px-wide <select> (frontdesk.css: .fd-tender-row select
         { flex: 0 0 90px }), which truncated "District Settlement" to
         "District S…" and hid every option behind a tap. -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <label style="font-size: 13px; color: #5a6c7d;">Payment</label>
      <button onClick="{{toggleSplit}}" style="background: none; border: none; color: #2980b9; cursor: pointer; font-size: 12px; font-weight: 600; padding: 0;">{{splitLabel}}</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 6px;">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.pick}}" style="{{m.style}}">
          <span style="{{m.radioStyle}}"><span style="{{m.dotStyle}}"></span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0;">
            <span style="font-size: 13px; font-weight: 600; color: {{m.textColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{m.name}}</span>
            <span style="font-size: 10.5px; color: {{m.subColor}};">{{m.account}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <!-- Aggregator tenders are money we are OWED, not money in the drawer, so
         they sit under their own heading rather than beside Cash. -->
    <sc-if value="{{hasSettlements}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 10px;">
        <div style="font-size: 11px; font-weight: 700; color: #95a5a6; letter-spacing: 0.3px; margin-bottom: 6px;">PORTAL SETTLEMENT</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{settlements}}" as="m" hint-placeholder-count="3">
            <button onClick="{{m.pick}}" style="{{m.style}}">
              <span style="{{m.radioStyle}}"><span style="{{m.dotStyle}}"></span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0;">
                <span style="font-size: 13px; font-weight: 600; color: {{m.textColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{m.name}}</span>
                <span style="font-size: 10.5px; color: {{m.subColor}};">{{m.account}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- Amount + quick tenders -->
    <div style="margin-top: 14px;">
      <label style="font-size: 13px; color: #5a6c7d; display: block; margin-bottom: 4px;">Amount</label>
      <input value="{{amount}}" onInput="{{onAmount}}" style="width: 100%; padding: 8px 10px; border: 1px solid #d0d4da; border-radius: 6px; font-size: 14px; box-sizing: border-box; color: #2c3e50;" />
      <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
          <button onClick="{{q.pick}}" style="{{q.style}}">{{q.label}}</button>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{needsRef}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 12px;">
        <label style="font-size: 13px; color: #5a6c7d; display: block; margin-bottom: 4px;">Reference no.</label>
        <input placeholder="Last 4 digits / UTR" style="width: 100%; padding: 8px 10px; border: 1px solid #d0d4da; border-radius: 6px; font-size: 14px; box-sizing: border-box;" />
        <span style="display: block; margin-top: 4px; font-size: 11px; color: #95a5a6;">Needed to reconcile {{selectedName}} against the statement.</span>
      </div>
    </sc-if>

    <!-- Split: the dropdown supported several tenders on one bill, so the
         redesign has to as well — one row per tender, each with its own
         visible selector rather than a nested dropdown. -->
    <sc-if value="{{split}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 14px; border-top: 1px solid #f0f4f8; padding-top: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 12px; font-weight: 700; color: #7f8c8d;">SECOND PAYMENT</span>
          <span style="font-size: 12px; color: #95a5a6;">₹{{remaining}} left</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{modes2}}" as="m" hint-placeholder-count="4">
            <button onClick="{{m.pick}}" style="{{m.style}}">
              <span style="{{m.radioStyle}}"><span style="{{m.dotStyle}}"></span></span>
              <span style="font-size: 13px; font-weight: 600; color: {{m.textColor}};">{{m.name}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- Payable -->
    <div style="background: #eafaf1; border: 1px solid #d5f5e3; border-radius: 8px; padding: 12px; margin-top: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 15px; font-weight: 700; color: #1e8449;">Amount Payable</span>
        <span style="font-size: 17px; font-weight: 700; color: #1e8449;">₹339.00</span>
      </div>
      <div style="font-size: 12px; color: #5a6c7d; margin-top: 6px;">{{tenderLine}}</div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 16px;">
      <button style="flex: 1; padding: 10px 16px; border-radius: 6px; border: 1px solid #d0d4da; background: transparent; color: #5a6c7d; font-size: 14px; font-weight: 500; cursor: pointer;">Cancel</button>
      <button style="flex: 2; padding: 10px 16px; border-radius: 6px; border: none; background: #0f3460; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;">Settle &amp; Post</button>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"showSettlements":{"editor":"boolean","default":true,"section":"Content"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'cash', mode2: null, split: false, amount: '339.00' };
  }

  // The tenant's real payment modes and the account each one lands in, from
  // 02-seed-data.sql PART 11f / 11h-2. Naming the account on the chip is what
  // stops a cashier booking a card sale into the cash drawer.
  primary() {
    return [
      { id: 'cash',   name: 'Cash',   account: 'Cash',   ref: false },
      { id: 'card',   name: 'Card',   account: 'Bank',   ref: true },
      { id: 'upi',    name: 'UPI',    account: 'Bank',   ref: true },
      { id: 'wallet', name: 'Wallet', account: 'Wallet', ref: true },
    ];
  }

  portals() {
    return [
      { id: 'zomato',   name: 'Zomato',   account: 'Aggregator Receivable', ref: true },
      { id: 'swiggy',   name: 'Swiggy',   account: 'Aggregator Receivable', ref: true },
      { id: 'district', name: 'District', account: 'Aggregator Receivable', ref: true },
    ];
  }

  chipStyle(on) {
    return 'display: flex; align-items: center; gap: 9px; text-align: left; cursor: pointer;'
      + ' padding: 10px 11px; border-radius: 8px; box-sizing: border-box; width: 100%;'
      + ' transition: all 0.15s ease; min-height: 46px;'
      + (on
        ? ' background: #eef4fb; border: 1.5px solid #0f3460;'
        : ' background: #fff; border: 1.5px solid #e1e5eb;');
  }

  // A real radio ring, drawn rather than relying on an accent-color the app
  // does not set — so selection reads the same in every browser.
  radioStyle(on) {
    return 'flex: 0 0 auto; width: 17px; height: 17px; border-radius: 50%;'
      + ' display: inline-flex; align-items: center; justify-content: center;'
      + (on ? ' border: 1.5px solid #0f3460;' : ' border: 1.5px solid #c4ccd6;');
  }

  dotStyle(on) {
    return 'width: 9px; height: 9px; border-radius: 50%; display: block;'
      + (on ? ' background: #0f3460;' : ' background: transparent;');
  }

  decorate(list, selected, onPick) {
    return list.map((m) => {
      const on = selected === m.id;
      return {
        name: m.name,
        account: m.account,
        style: this.chipStyle(on),
        radioStyle: this.radioStyle(on),
        dotStyle: this.dotStyle(on),
        textColor: on ? '#0f3460' : '#2c3e50',
        subColor: on ? '#5b7ba6' : '#95a5a6',
        pick: () => onPick(m.id),
      };
    });
  }

  renderVals() {
    const { mode, mode2, split, amount } = this.state;
    const all = this.primary().concat(this.portals());
    const sel = all.filter((m) => m.id === mode)[0] || all[0];

    const quickStyle = 'padding: 5px 12px; border-radius: 14px; border: 1px solid #d0d4da;'
      + ' background: #fff; color: #5a6c7d; font-size: 12px; font-weight: 600; cursor: pointer;';

    const quick = [
      { label: 'Exact ₹339', v: '339.00' },
      { label: '₹500', v: '500.00' },
      { label: '₹1000', v: '1000.00' },
    ].map((q) => ({
      label: q.label,
      style: quickStyle,
      pick: () => this.setState({ amount: q.v }),
    }));

    const paid = Number(amount) || 0;
    const remaining = Math.max(0, 339 - paid).toFixed(2);

    return {
      modes: this.decorate(this.primary(), mode, (id) => this.setState({ mode: id })),
      settlements: this.decorate(this.portals(), mode, (id) => this.setState({ mode: id })),
      modes2: this.decorate(this.primary(), mode2, (id) => this.setState({ mode2: id })),
      hasSettlements: this.props.showSettlements !== false,
      needsRef: !!sel.ref,
      selectedName: sel.name,
      quick,
      amount,
      onAmount: (e) => this.setState({ amount: e.target.value }),
      split,
      splitLabel: split ? '− Remove split' : '+ Split payment',
      toggleSplit: () => this.setState({ split: !split }),
      remaining,
      tenderLine: split
        ? 'Split across two tenders'
        : sel.name + ' → ' + sel.account,
    };
  }
}
</script>
</body>
</html>
